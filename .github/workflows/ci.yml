name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Build (placeholder key; pages load products at request time)
        run: npm run build
        env:
          NEXT_PUBLIC_BTAB_PUBLISHABLE_KEY: btab_pk_test_placeholder
